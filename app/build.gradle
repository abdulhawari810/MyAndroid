plugins {
    id 'com.android.application'
}

android {
    namespace 'com.programmerid.myandroid'

    compileSdk 35

    defaultConfig {

        applicationId "com.programmerid.myandroid"

        minSdk 24
        targetSdk 35

        versionCode 1
        versionName "1.0"

    }

  buildFeatures {
    viewBinding true
}

    buildTypes {

        release {

            minifyEnabled false

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ),
                    'proguard-rules.pro'

        }

    }

    compileOptions {

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

    }

}

dependencies {

  def room_version = "2.6.1"

    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version" // kalau pakai Java
    implementation "androidx.room:room-rxjava2:$room_version" // opsional

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

  implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
implementation 'androidx.navigation:navigation-fragment:2.8.0'
implementation 'androidx.navigation:navigation-ui:2.8.0'

}